<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZenityHost | Zamówienie</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top, #102b4f, #050b14 70%);
            color: white;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .top {
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(4,9,19,.88);
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
        }

        .brand span {
            color: #4da3ff;
        }

        .wallet {
            padding: 10px 15px;
            border-radius: 10px;
            background: linear-gradient(135deg,#d4a72c,#f4d05c);
            color: #111827;
            font-weight: 800;
        }

        .container {
            width: min(950px, 92%);
            margin: auto;
            padding: 45px 0 70px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #70b5ff;
            font-size: 14px;
        }

        .box {
            padding: 30px;
            border-radius: 18px;
            background: #0b1728;
            border: 1px solid rgba(255,255,255,.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 25px;
            color: #91a1b4;
            line-height: 1.6;
        }

        .section {
            margin-top: 25px;
        }

        .section-title {
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 800;
            color: #dce9f7;
        }

        select,
        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            background: #071525;
            color: white;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: #3289df;
        }

        .durations {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .duration {
            padding: 15px;
            border-radius: 11px;
            background: #10243c;
            border: 1px solid rgba(255,255,255,.08);
            color: white;
            cursor: pointer;
            font-weight: 800;
        }

        .duration:hover {
            border-color: #3289df;
        }

        .duration.active {
            background: #1764a8;
            border-color: #4da3ff;
        }

        .config {
            display: grid;
            gap: 12px;
        }

        .discount-row {
            display: grid;
            grid-template-columns: 1fr 130px;
            gap: 10px;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .discount-button {
            border-radius: 10px;
            background: #10243c;
            color: white;
            font-weight: 800;
            border: 1px solid rgba(255,255,255,.1);
        }

        .summary {
            margin-top: 25px;
            padding: 20px;
            border-radius: 14px;
            background: rgba(77,163,255,.07);
            border: 1px solid rgba(77,163,255,.18);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 7px 0;
            color: #aebed0;
        }

        .summary-row strong {
            color: white;
        }

        .total {
            margin-top: 12px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,.1);
            font-size: 21px;
            color: #f4d05c;
        }

        .buy {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border-radius: 11px;
            background: linear-gradient(135deg,#1665ad,#3289df);
            color: white;
            font-weight: 900;
            font-size: 15px;
        }

        .buy:hover {
            filter: brightness(1.1);
        }

        .message {
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            display: none;
            background: rgba(255,255,255,.05);
            color: #bcd0e5;
        }

        .message.error {
            display: block;
            background: rgba(255,70,70,.08);
            color: #ff9c9c;
        }

        .message.success {
            display: block;
            background: rgba(70,200,120,.08);
            color: #8ff0b5;
        }

        .loading {
            padding: 30px 0;
            text-align: center;
            color: #91a1b4;
        }

        @media(max-width:700px) {
            .durations {
                grid-template-columns: 1fr;
            }

            .discount-row {
                grid-template-columns: 1fr;
            }

            .top {
                padding: 15px 4%;
            }

            .wallet {
                font-size: 12px;
            }

            .box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header class="top">

    <a href="/hosting" class="brand">
        Zenity<span>Host</span>
    </a>

    <a href="/wallet" class="wallet">
        💰 Portfel:
        <span id="walletBalance">...</span>
    </a>

</header>

<main class="container">

    <a href="/hosting" class="back">
        ← Wróć do ZenityHost
    </a>

    <div class="box">

        <h1 id="title">
            Zamówienie
        </h1>

        <p id="description" class="description">
            Wybierz pakiet i skonfiguruj usługę.
        </p>

        <div id="loading" class="loading">
            Ładowanie...
        </div>

        <div id="content" style="display:none;">

            <div class="section">

                <div class="section-title">
                    Pakiet
                </div>

                <select id="packageSelect"></select>

            </div>

            <div class="section">

                <div class="section-title">
                    Okres
                </div>

                <div class="durations">

                    <button class="duration" data-days="7">
                        7 dni
                    </button>

                    <button class="duration" data-days="30">
                        30 dni
                    </button>

                    <button class="duration" data-days="90">
                        90 dni
                    </button>

                </div>

            </div>

            <div class="section">

                <div class="section-title">
                    Konfiguracja
                </div>

                <div id="config" class="config"></div>

            </div>

            <div class="section">

                <div class="section-title">
                    Kod rabatowy
                </div>

                <div class="discount-row">

                    <input
                        id="discountCode"
                        type="text"
                        placeholder="np. ZENITY10"
                    >

                    <button
                        id="discountButton"
                        class="discount-button"
                    >
                        Sprawdź
                    </button>

                </div>

            </div>

            <div class="summary">

                <div class="summary-row">
                    <span>Usługa</span>
                    <strong id="summaryType">—</strong>
                </div>

                <div class="summary-row">
                    <span>Pakiet</span>
                    <strong id="summaryPackage">—</strong>
                </div>

                <div class="summary-row">
                    <span>Okres</span>
                    <strong id="summaryDays">—</strong>
                </div>

                <div class="summary-row">
                    <span>Cena</span>
                    <strong id="summaryPrice">0.00 zł</strong>
                </div>

                <div
                    id="discountRow"
                    class="summary-row"
                    style="display:none;"
                >
                    <span>Rabat</span>
                    <strong id="summaryDiscount">
                        0%
                    </strong>
                </div>

                <div class="summary-row total">
                    <span>Do zapłaty</span>
                    <strong id="summaryTotal">
                        0.00 zł
                    </strong>
                </div>

                <button id="buyButton" class="buy">
                    Kup usługę
                </button>

                <div id="message" class="message"></div>

            </div>

        </div>

    </div>

</main>

<script>

const API = "/api/hosting";

const params =
    new URLSearchParams(
        window.location.search
    );

const type =
    params.get("type");

const names = {
    minecraft: "Minecraft",
    discord: "Discord Bot",
    web: "Web Hosting"
};

const title =
    document.getElementById("title");

const description =
    document.getElementById("description");

const loading =
    document.getElementById("loading");

const content =
    document.getElementById("content");

const packageSelect =
    document.getElementById("packageSelect");

const config =
    document.getElementById("config");

const message =
    document.getElementById("message");

const buyButton =
    document.getElementById("buyButton");

let prices = {};
let options = {};
let selectedDays = 30;
let discountPercent = 0;


/*
    API
*/

async function api(url, options = {}) {

    const response =
        await fetch(
            url,
            {
                credentials: "include",
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            }
        );

    let data = {};

    try {
        data =
            await response.json();
    } catch {
        data = {};
    }

    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            `HTTP ${response.status}`
        );

    }

    return data;
}


/*
    WALLET
*/

async function loadWallet() {

    try {

        const data =
            await fetch(
                "/api/wallet",
                {
                    credentials: "include"
                }
            ).then(r => r.json());

        const balance =
            Number(
                data.balance ??
                data.wallet?.balance ??
                0
            );

        document.getElementById(
            "walletBalance"
        ).textContent =
            balance.toFixed(2) + " zł";

    } catch {

        document.getElementById(
            "walletBalance"
        ).textContent = "—";

    }

}


/*
    START
*/

async function start() {

    if (
        !type ||
        !["minecraft", "discord", "web"].includes(type)
    ) {

        loading.style.display = "none";

        title.textContent =
            "Nie wybrano usługi";

        description.textContent =
            "Wróć do ZenityHost i wybierz usługę.";

        return;

    }

    title.textContent =
        `Hosting ${names[type]}`;

    description.textContent =
        `Skonfiguruj i zamów swój hosting ${names[type]}.`;

    try {

        const [
            priceData,
            optionData
        ] = await Promise.all([

            api(`${API}/prices`),

            api(
                `${API}/${type}/options`
            )

        ]);

        prices =
            priceData.prices ||
            priceData ||
            {};

        options =
            optionData ||
            {};

        render();

        loading.style.display =
            "none";

        content.style.display =
            "block";

    } catch (error) {

        loading.textContent =
            `Nie udało się załadować oferty: ${error.message}`;

    }

}


/*
    RENDER
*/

function render() {

    const servicePrices =
        prices[type] || {};

    let packages =
        Object.keys(servicePrices);

    if (!packages.length) {

        if (type === "minecraft") {

            packages = [
                "Dirt",
                "Obsidian",
                "Złoto",
                "Szmaragd",
                "Diament"
            ];

        }

    }

    packageSelect.innerHTML =
        packages.map(
            name =>
                `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`
        ).join("");

    renderConfig();
    updateSummary();

}


/*
    CONFIG
*/

function renderConfig() {

    config.innerHTML = "";

    if (type === "minecraft") {

        const software =
            options.software ||
            [
                "paper",
                "purpur",
                "vanilla"
            ];

        const versions =
            options.versions ||
            options.minecraftVersions ||
            [
                "1.21.4",
                "1.21.3",
                "1.21.1",
                "1.21",
                "1.20.6",
                "1.20.4",
                "1.20.2",
                "1.20.1"
            ];

        config.innerHTML = `

            <select id="software">

                ${software.map(
                    item => `
                        <option value="${escapeHtml(item)}">
                            ${escapeHtml(
                                item.charAt(0).toUpperCase() +
                                item.slice(1)
                            )}
                        </option>
                    `
                ).join("")}

            </select>

            <select id="version">

                ${versions.map(
                    item => `
                        <option value="${escapeHtml(item)}">
                            Minecraft ${escapeHtml(item)}
                        </option>
                    `
                ).join("")}

            </select>

            <input
                id="serverName"
                type="text"
                maxlength="32"
                placeholder="Nazwa serwera"
                value="Mój serwer"
            >

        `;

        return;
    }


    if (type === "discord") {

        const nodes =
            options.nodeVersions ||
            options.nodes ||
            ["22", "20", "18"];

        config.innerHTML = `

            <select id="nodeVersion">

                ${nodes.map(
                    item => `
                        <option value="${escapeHtml(item)}">
                            Node.js ${escapeHtml(item)}
                        </option>
                    `
                ).join("")}

            </select>

            <input
                id="botName"
                type="text"
                maxlength="32"
                placeholder="Nazwa bota"
                value="Mój bot"
            >

        `;

        return;
    }


    if (type === "web") {

        const webTypes =
            options.types ||
            options.webTypes ||
            ["static", "php"];

        config.innerHTML = `

            <select id="webType">

                ${webTypes.map(
                    item => `
                        <option value="${escapeHtml(item)}">
                            ${escapeHtml(
                                item === "static"
                                    ? "HTML / CSS / JS"
                                    : "PHP"
                            )}
                        </option>
                    `
                ).join("")}

            </select>

            <input
                id="webName"
                type="text"
                maxlength="32"
                placeholder="Nazwa strony"
                value="Moja strona"
            >

        `;

    }

}


/*
    OKRES
*/

document.querySelectorAll(".duration")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".duration")
                    .forEach(
                        x =>
                            x.classList.remove("active")
                    );

                button.classList.add("active");

                selectedDays =
                    Number(
                        button.dataset.days
                    );

                updateSummary();

            }
        );

    });

document
    .querySelector('[data-days="30"]')
    ?.classList.add("active");


/*
    PODSUMOWANIE
*/

function getSelectedPackage() {

    return packageSelect.value;

}

function getPrice() {

    const servicePrices =
        prices[type] || {};

    const selected =
        servicePrices[
            getSelectedPackage()
        ];

    if (
        selected &&
        typeof selected === "object"
    ) {

        return Number(
            selected[selectedDays] || 0
        );

    }

    return Number(
        selected || 0
    );

}

function updateSummary() {

    const packageName =
        getSelectedPackage();

    const price =
        getPrice();

    const total =
        Math.max(
            0,
            price -
            (price * discountPercent / 100)
        );

    document.getElementById(
        "summaryType"
    ).textContent =
        names[type] || "—";

    document.getElementById(
        "summaryPackage"
    ).textContent =
        packageName || "—";

    document.getElementById(
        "summaryDays"
    ).textContent =
        `${selectedDays} dni`;

    document.getElementById(
        "summaryPrice"
    ).textContent =
        `${price.toFixed(2)} zł`;

    document.getElementById(
        "summaryTotal"
    ).textContent =
        `${total.toFixed(2)} zł`;

    const discountRow =
        document.getElementById(
            "discountRow"
        );

    if (discountPercent > 0) {

        discountRow.style.display =
            "flex";

        document.getElementById(
            "summaryDiscount"
        ).textContent =
            `${discountPercent}%`;

    } else {

        discountRow.style.display =
            "none";

    }

}


/*
    ZMIANA PAKIETU
*/

packageSelect.addEventListener(
    "change",
    updateSummary
);


/*
    KOD RABATOWY
*/

document
    .getElementById("discountButton")
    .addEventListener(
        "click",
        async () => {

            const input =
                document.getElementById(
                    "discountCode"
                );

            const code =
                input.value.trim();

            if (!code) {

                discountPercent = 0;

                updateSummary();

                showMessage(
                    "Wpisz kod rabatowy.",
                    true
                );

                return;

            }

            try {

                const data =
                    await api(
                        `${API}/codes/check`,
                        {
                            method: "POST",
                            body: JSON.stringify({
                                code
                            })
                        }
                    );

                discountPercent =
                    Number(
                        data.percent ??
                        data.discount ??
                        data.discountPercent ??
                        0
                    );

                updateSummary();

                showMessage(
                    discountPercent > 0
                        ? `Kod aktywny: ${discountPercent}% rabatu.`
                        : "Kod nie daje rabatu.",
                    false
                );

            } catch (error) {

                discountPercent = 0;

                updateSummary();

                showMessage(
                    error.message,
                    true
                );

            }

        }
    );


/*
    KUPNO
*/

buyButton.addEventListener(
    "click",
    async () => {

        buyButton.disabled = true;

        buyButton.textContent =
            "Kupowanie...";

        try {

            const configData =
                getConfig();

            const body = {

                type,

                package:
                    getSelectedPackage(),

                days:
                    selectedDays,

                config:
                    configData

            };

            const code =
                document
                    .getElementById(
                        "discountCode"
                    )
                    .value
                    .trim();

            if (code) {

                body.code =
                    code;

            }

            const data =
                await api(
                    `${API}/purchase`,
                    {
                        method: "POST",
                        body:
                            JSON.stringify(body)
                    }
                );

            showMessage(
                "Usługa została zakupiona. Przechodzę do panelu...",
                false
            );

            const service =
                data.service ||
                data;

            const id =
                service.id;

            if (!id) {

                window.location.href =
                    "/hosting";

                return;

            }

            setTimeout(
                () => {

                    if (type === "minecraft") {

                        window.location.href =
                            `/hosting/services/minecraft/?id=${encodeURIComponent(id)}`;

                        return;

                    }

                    if (type === "discord") {

                        window.location.href =
                            `/hosting/services/discord/?id=${encodeURIComponent(id)}`;

                        return;

                    }

                    if (type === "web") {

                        window.location.href =
                            `/hosting/services/web/?id=${encodeURIComponent(id)}`;

                        return;

                    }

                    window.location.href =
                        `/hosting`;

                },
                700
            );

        } catch (error) {

            showMessage(
                error.message,
                true
            );

            buyButton.disabled =
                false;

            buyButton.textContent =
                "Kup usługę";

        }

    }
);


/*
    CONFIG DATA
*/

function getConfig() {

    if (type === "minecraft") {

        return {

            software:
                document.getElementById(
                    "software"
                )?.value || "paper",

            version:
                document.getElementById(
                    "version"
                )?.value || "1.21.4",

            serverName:
                document.getElementById(
                    "serverName"
                )?.value.trim() ||
                "Mój serwer"

        };

    }


    if (type === "discord") {

        return {

            nodeVersion:
                document.getElementById(
                    "nodeVersion"
                )?.value || "22",

            botName:
                document.getElementById(
                    "botName"
                )?.value.trim() ||
                "Mój bot"

        };

    }


    if (type === "web") {

        return {

            webType:
                document.getElementById(
                    "webType"
                )?.value || "static",

            webName:
                document.getElementById(
                    "webName"
                )?.value.trim() ||
                "Moja strona"

        };

    }

    return {};

}


/*
    WIADOMOŚĆ
*/

function showMessage(
    text,
    error = false
) {

    message.textContent =
        text;

    message.className =
        `message ${error ? "error" : "success"}`;

}


/*
    ESCAPE
*/

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


loadWallet();
start();

</script>

</body>
</html>
