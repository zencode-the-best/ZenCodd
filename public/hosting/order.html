<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZenityHost — Zamów usługę</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(242,201,76,.08),
                    transparent 35%
                ),
                #07111f;
            color: #fff;
            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        .topbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom:
                1px solid rgba(255,255,255,.07);
            background:
                rgba(5,13,24,.92);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: .5px;
        }

        .logo span {
            color: #f2c94c;
        }

        .back {
            color: #aebbd0;
            text-decoration: none;
            font-weight: 700;
        }

        .back:hover {
            color: #fff;
        }

        main {
            width: min(1180px, calc(100% - 30px));
            margin: 35px auto 60px;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .header p {
            margin: 0;
            color: #91a0b5;
            font-size: 16px;
        }

        .layout {
            display: grid;
            grid-template-columns:
                minmax(0, 1.5fr)
                minmax(320px, .8fr);
            gap: 25px;
            align-items: start;
        }

        .card {
            background:
                linear-gradient(
                    145deg,
                    rgba(16,35,58,.96),
                    rgba(8,20,35,.96)
                );
            border:
                1px solid rgba(255,255,255,.07);
            border-radius: 16px;
            padding: 25px;
            box-shadow:
                0 18px 45px rgba(0,0,0,.2);
        }

        .card h2 {
            margin: 0 0 20px;
            font-size: 19px;
        }

        .field {
            margin-bottom: 22px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #dce4ef;
            font-weight: 800;
        }

        select,
        input {
            width: 100%;
            border: 1px solid rgba(255,255,255,.08);
            background: #0a192b;
            color: #fff;
            border-radius: 10px;
            padding: 13px;
            outline: none;
            font-size: 15px;
        }

        select:focus,
        input:focus {
            border-color: rgba(242,201,76,.6);
        }

        .packages {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .package {
            cursor: pointer;
            padding: 17px;
            border-radius: 12px;
            background: #0b1b2e;
            border:
                1px solid rgba(255,255,255,.07);
            transition:
                .15s ease;
        }

        .package:hover {
            transform: translateY(-2px);
            border-color:
                rgba(242,201,76,.35);
        }

        .package.active {
            border-color: #f2c94c;
            background:
                rgba(242,201,76,.08);
            box-shadow:
                0 0 0 1px rgba(242,201,76,.12);
        }

        .package-name {
            font-weight: 900;
            font-size: 16px;
        }

        .package-price {
            margin-top: 7px;
            color: #f2c94c;
            font-weight: 900;
        }

        .days {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 10px;
        }

        .day {
            cursor: pointer;
            text-align: center;
            padding: 13px 8px;
            border-radius: 10px;
            background: #0b1b2e;
            border:
                1px solid rgba(255,255,255,.07);
            font-weight: 800;
            transition: .15s ease;
        }

        .day:hover {
            border-color:
                rgba(242,201,76,.35);
        }

        .day.active {
            color: #111;
            background: #f2c94c;
            border-color: #f2c94c;
        }

        .config {
            display: none;
            padding: 18px;
            margin-top: 15px;
            border-radius: 12px;
            background:
                rgba(0,0,0,.12);
            border:
                1px solid rgba(255,255,255,.06);
        }

        .config .field {
            margin-bottom: 15px;
        }

        .config .field:last-child {
            margin-bottom: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 10px 0;
            color: #9faec1;
        }

        .summary-row strong {
            color: #fff;
            text-align: right;
        }

        .total {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 14px;
            padding-top: 18px;
            border-top:
                1px solid rgba(255,255,255,.08);
            font-size: 21px;
            font-weight: 900;
        }

        .total strong {
            color: #f2c94c;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .purchase {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            border-radius: 11px;
            background: #f2c94c;
            color: #111;
            font-weight: 900;
            font-size: 16px;
        }

        .purchase:hover:not(:disabled) {
            filter: brightness(1.05);
        }

        .purchase:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .secondary {
            background: #14273e;
            color: #fff;
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 10px;
            color: #ff9b9b;
            background:
                rgba(210,50,50,.12);
            border:
                1px solid rgba(210,50,50,.3);
        }

        .discount-info {
            margin-top: 10px;
            color: #8fa0b5;
            font-size: 14px;
        }

        .loading {
            color: #8fa0b5;
            padding: 15px 0;
        }

        .wallet {
            margin-bottom: 20px;
            padding: 16px;
            border-radius: 12px;
            background:
                rgba(242,201,76,.06);
            border:
                1px solid rgba(242,201,76,.14);
        }

        .wallet-title {
            color: #9faec1;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .wallet-balance {
            color: #f2c94c;
            font-size: 25px;
            font-weight: 900;
        }

        @media (max-width: 800px) {

            .layout {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 0 15px;
            }

            .header h1 {
                font-size: 28px;
            }

        }

        @media (max-width: 520px) {

            .packages {
                grid-template-columns: 1fr;
            }

            .days {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header class="topbar">

    <div class="logo">
        ZENITY<span>HOST</span>
    </div>

    <a
        href="/hosting/"
        class="back"
    >
        ← Wróć
    </a>

</header>

<main>

    <div class="header">

        <h1 id="title">
            Zamów usługę
        </h1>

        <p id="subtitle">
            Wybierz pakiet i skonfiguruj usługę.
        </p>

    </div>

    <div class="layout">

        <section class="card">

            <h2>
                Konfiguracja
            </h2>

            <div class="field">

                <label>
                    Pakiet
                </label>

                <div
                    id="packages"
                    class="packages"
                ></div>

            </div>

            <div class="field">

                <label>
                    Okres
                </label>

                <div class="days">

                    <div
                        class="day active"
                        data-days="7"
                    >
                        7 dni
                    </div>

                    <div
                        class="day"
                        data-days="30"
                    >
                        30 dni
                    </div>

                    <div
                        class="day"
                        data-days="90"
                    >
                        90 dni
                    </div>

                </div>

            </div>

            <!-- MINECRAFT -->

            <div
                id="minecraftConfig"
                class="config"
            >

                <div class="field">

                    <label
                        for="minecraftSoftware"
                    >
                        Oprogramowanie
                    </label>

                    <select
                        id="minecraftSoftware"
                    >

                        <option value="vanilla">
                            Vanilla
                        </option>

                        <option value="paper">
                            Paper
                        </option>

                        <option value="purpur">
                            Purpur
                        </option>

                        <option value="fabric">
                            Fabric
                        </option>

                        <option value="forge">
                            Forge
                        </option>

                        <option value="velocity">
                            Velocity
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label
                        for="minecraftVersion"
                    >
                        Wersja Minecraft
                    </label>

                    <select
                        id="minecraftVersion"
                    >

                        <option value="">
                            Ładowanie...
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label
                        for="serverName"
                    >
                        Nazwa serwera
                    </label>

                    <input
                        id="serverName"
                        value="Blazemc.pl"
                        placeholder="np. Blazemc.pl"
                    >

                </div>

            </div>

            <!-- DISCORD -->

            <div
                id="discordConfig"
                class="config"
            >

                <div class="field">

                    <label
                        for="discordNode"
                    >
                        Wersja Node.js
                    </label>

                    <select
                        id="discordNode"
                    >

                        <option value="18">
                            Node.js 18
                        </option>

                        <option value="20">
                            Node.js 20
                        </option>

                        <option value="22">
                            Node.js 22
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label
                        for="discordBotName"
                    >
                        Nazwa bota
                    </label>

                    <input
                        id="discordBotName"
                        placeholder="np. ZenityBot"
                    >

                </div>

            </div>

            <!-- WWW -->

            <div
                id="webConfig"
                class="config"
            >

                <div class="field">

                    <label
                        for="webType"
                    >
                        Typ strony
                    </label>

                    <select
                        id="webType"
                    >

                        <option value="static">
                            Static HTML
                        </option>

                        <option value="php">
                            PHP
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label
                        for="webName"
                    >
                        Nazwa strony
                    </label>

                    <input
                        id="webName"
                        placeholder="np. moja-strona"
                    >

                </div>

            </div>

        </section>

        <aside class="card">

            <h2>
                Podsumowanie
            </h2>

            <div class="wallet">

                <div class="wallet-title">
                    Twój portfel
                </div>

                <div
                    id="walletBalance"
                    class="wallet-balance"
                >
                    0.00 zł
                </div>

            </div>

            <div class="summary-row">

                <span>
                    Usługa
                </span>

                <strong id="summaryType">
                    —
                </strong>

            </div>

            <div class="summary-row">

                <span>
                    Pakiet
                </span>

                <strong id="summaryPackage">
                    —
                </strong>

            </div>

            <div class="summary-row">

                <span>
                    Okres
                </span>

                <strong id="summaryDays">
                    7 dni
                </strong>

            </div>

            <div class="field">

                <label for="discountCode">
                    Kod rabatowy
                </label>

                <input
                    id="discountCode"
                    placeholder="NP. START10"
                >

                <button
                    id="checkCode"
                    class="purchase secondary"
                    type="button"
                >
                    Sprawdź kod
                </button>

                <div
                    id="discountInfo"
                    class="discount-info"
                ></div>

            </div>

            <div class="total">

                <span>
                    Do zapłaty
                </span>

                <strong id="total">
                    0.00 zł
                </strong>

            </div>

            <button
                id="purchaseButton"
                class="purchase"
                type="button"
                disabled
            >
                Kup usługę
            </button>

            <div
                id="error"
                class="error"
            ></div>

        </aside>

    </div>

</main>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const type =
    String(
        params.get("type") ||
        ""
    ).trim().toLowerCase();

const API =
    "/api/hosting";

const typeNames = {

    minecraft:
        "Serwery Minecraft",

    discord:
        "Boty Discord",

    web:
        "Strony WWW"

};

/*
 * Ceny są rozdzielone według typu usługi.
 */

const localPrices = {

    minecraft: {

        Dirt: {
            7: 2.99,
            30: 9.99,
            90: 24.99
        },

        Obsidian: {
            7: 6.99,
            30: 19.99,
            90: 49.99
        },

        Złoto: {
            7: 11.99,
            30: 34.99,
            90: 89.99
        },

        Szmaragd: {
            7: 18.99,
            30: 54.99,
            90: 139.99
        },

        Diament: {
            7: 29.99,
            30: 84.99,
            90: 219.99
        }

    },

    discord: {

        "Bot Start": {
            7: 1,
            30: 3,
            90: 8
        },

        "Bot Plus": {
            7: 2,
            30: 6,
            90: 15
        },

        "Bot PRO": {
            7: 4,
            30: 10,
            90: 25
        }

    },

    web: {

        "WWW Start": {
            7: 2,
            30: 5,
            90: 12
        },

        "WWW Plus": {
            7: 4,
            30: 10,
            90: 25
        },

        "WWW PRO": {
            7: 7,
            30: 18,
            90: 45
        }

    }

};

let prices =
    structuredClone(
        localPrices
    );

let selectedPackage =
    null;

let selectedDays =
    7;

let walletBalance =
    0;

let discountPercent =
    0;

let appliedDiscountCode =
    null;

const packagesElement =
    document.getElementById(
        "packages"
    );

const purchaseButton =
    document.getElementById(
        "purchaseButton"
    );

function showError(message) {

    const element =
        document.getElementById(
            "error"
        );

    element.textContent =
        message;

    element.style.display =
        "block";

}

function hideError() {

    const element =
        document.getElementById(
            "error"
        );

    element.textContent =
        "";

    element.style.display =
        "none";

}

function money(value) {

    return `${Number(
        value || 0
    ).toFixed(2)} zł`;

}

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

function getPackagePrice() {

    const service =
        prices[type];

    if (
        !service ||
        !selectedPackage ||
        !service[selectedPackage]
    ) {
        return 0;
    }

    return Number(
        service[selectedPackage][
            selectedDays
        ] || 0
    );

}

function getFinalPrice() {

    const price =
        getPackagePrice();

    if (
        !Number.isFinite(price) ||
        price <= 0
    ) {
        return 0;
    }

    if (
        !discountPercent ||
        discountPercent <= 0
    ) {
        return price;
    }

    return Math.max(
        0,
        price -
        (
            price *
            discountPercent /
            100
        )
    );

}

function getConfig() {

    if (type === "minecraft") {

        return {

            software:
                document.getElementById(
                    "minecraftSoftware"
                )?.value || "vanilla",

            minecraftVersion:
                document.getElementById(
                    "minecraftVersion"
                )?.value || "",

            serverName:
                document.getElementById(
                    "serverName"
                )?.value.trim() ||
                "Serwer Minecraft"

        };

    }

    if (type === "discord") {

        return {

            nodeVersion:
                document.getElementById(
                    "discordNode"
                )?.value || "20",

            botName:
                document.getElementById(
                    "discordBotName"
                )?.value.trim() ||
                "ZenityBot"

        };

    }

    if (type === "web") {

        return {

            webType:
                document.getElementById(
                    "webType"
                )?.value || "static",

            webName:
                document.getElementById(
                    "webName"
                )?.value.trim() ||
                "moja-strona"

        };

    }

    return {};

}

function updateSummary() {

    document.getElementById(
        "summaryType"
    ).textContent =
        typeNames[type] ||
        "—";

    document.getElementById(
        "summaryPackage"
    ).textContent =
        selectedPackage ||
        "—";

    document.getElementById(
        "summaryDays"
    ).textContent =
        `${selectedDays} dni`;

    document.getElementById(
        "total"
    ).textContent =
        money(
            getFinalPrice()
        );

    purchaseButton.disabled =
        !selectedPackage ||
        getPackagePrice() <= 0;

}

function renderPackages() {

    const service =
        prices[type];

    if (
        !service ||
        typeof service !== "object"
    ) {

        packagesElement.innerHTML =
            "";

        showError(
            "Nieprawidłowy typ usługi."
        );

        purchaseButton.disabled =
            true;

        return;

    }

    packagesElement.innerHTML =
        "";

    const packageNames =
        Object.keys(service);

    if (!packageNames.length) {

        packagesElement.innerHTML =
            `<div class="loading">
                Brak dostępnych pakietów.
            </div>`;

        purchaseButton.disabled =
            true;

        return;

    }

    if (
        !selectedPackage ||
        !service[selectedPackage]
    ) {

        selectedPackage =
            packageNames[0];

    }

    packageNames.forEach(
        name => {

            const price =
                Number(
                    service[name]?.[
                        selectedDays
                    ] || 0
                );

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "package";

            if (
                name ===
                selectedPackage
            ) {

                element.classList.add(
                    "active"
                );

            }

            element.innerHTML = `

                <div class="package-name">
                    ${escapeHtml(name)}
                </div>

                <div class="package-price">
                    ${money(price)}
                </div>

            `;

            element.addEventListener(
                "click",
                () => {

                    selectedPackage =
                        name;

                    document
                        .querySelectorAll(
                            ".package"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "active"
                                )
                        );

                    element.classList.add(
                        "active"
                    );

                    updateSummary();

                }
            );

            packagesElement.appendChild(
                element
            );

        }
    );

    updateSummary();

}

async function loadPrices() {

    try {

        const response =
            await fetch(
                `${API}/prices`,
                {
                    credentials:
                        "include"
                }
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const remotePrices =
            data.prices ||
            data.data ||
            data;

        if (
            remotePrices &&
            typeof remotePrices === "object"
        ) {

            if (
                remotePrices.minecraft &&
                typeof remotePrices.minecraft === "object"
            ) {

                prices.minecraft =
                    remotePrices.minecraft;

            }

            if (
                remotePrices.discord &&
                typeof remotePrices.discord === "object"
            ) {

                prices.discord =
                    remotePrices.discord;

            }

            if (
                remotePrices.web &&
                typeof remotePrices.web === "object"
            ) {

                prices.web =
                    remotePrices.web;

            }

        }

    } catch (error) {

        console.warn(
            "Nie udało się pobrać cen z API:",
            error
        );

    }

    renderPackages();

}

async function loadWallet() {

    try {

        const response =
            await fetch(
                "/api/wallet",
                {
                    credentials:
                        "include"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Nie udało się pobrać portfela."
            );

        }

        walletBalance =
            Number(
                data.balance ??
                data.wallet?.balance ??
                data.data?.balance ??
                0
            );

        document.getElementById(
            "walletBalance"
        ).textContent =
            money(walletBalance);

    } catch (error) {

        console.error(
            "Wallet:",
            error
        );

        walletBalance =
            0;

        document.getElementById(
            "walletBalance"
        ).textContent =
            "0.00 zł";

    }

}

function extractVersions(data) {

    if (
        Array.isArray(data)
    ) {
        return data;
    }

    if (
        Array.isArray(data?.versions)
    ) {
        return data.versions;
    }

    if (
        Array.isArray(data?.data)
    ) {
        return data.data;
    }

    if (
        Array.isArray(data?.data?.versions)
    ) {
        return data.data.versions;
    }

    return [];

}

async function loadMinecraftVersions() {

    if (
        type !== "minecraft"
    ) {
        return;
    }

    const software =
        document.getElementById(
            "minecraftSoftware"
        )?.value || "vanilla";

    const select =
        document.getElementById(
            "minecraftVersion"
        );

    if (!select) {
        return;
    }

    select.innerHTML =
        `<option value="">
            Ładowanie...
        </option>`;

    try {

        const response =
            await fetch(
                `${API}/minecraft/options?software=${encodeURIComponent(software)}`,
                {
                    credentials:
                        "include"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Nie udało się pobrać wersji Minecraft."
            );

        }

        const versions =
            extractVersions(data);

        select.innerHTML =
            "";

        if (!versions.length) {

            select.innerHTML =
                `<option value="">
                    Brak dostępnych wersji
                </option>`;

            return;

        }

        versions.forEach(
            version => {

                const value =
                    String(
                        typeof version === "object"
                            ? (
                                version.version ||
                                version.id ||
                                version.name ||
                                ""
                            )
                            : version
                    );

                if (!value) {
                    return;
                }

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    value;

                option.textContent =
                    value;

                select.appendChild(
                    option
                );

            }
        );

    } catch (error) {

        console.error(
            "Minecraft versions:",
            error
        );

        select.innerHTML =
            `<option value="">
                Nie udało się pobrać wersji
            </option>`;

    }

}

async function loadMinecraftOptions() {

    if (
        type !== "minecraft"
    ) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API}/minecraft/options`,
                {
                    credentials:
                        "include"
                }
            );

        if (!response.ok) {

            await loadMinecraftVersions();

            return;

        }

        const data =
            await response.json();

        const softwareList =
            Array.isArray(
                data?.software
            )
                ? data.software
                : Array.isArray(
                    data?.softwareList
                )
                    ? data.softwareList
                    : [];

        const softwareSelect =
            document.getElementById(
                "minecraftSoftware"
            );

        if (
            softwareSelect &&
            softwareList.length
        ) {

            softwareSelect.innerHTML =
                "";

            softwareList.forEach(
                item => {

                    const value =
                        String(
                            typeof item === "object"
                                ? (
                                    item.id ||
                                    item.value ||
                                    item.name ||
                                    ""
                                )
                                : item
                        ).toLowerCase();

                    if (!value) {
                        return;
                    }

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        value;

                    option.textContent =
                        value.charAt(0).toUpperCase() +
                        value.slice(1);

                    softwareSelect.appendChild(
                        option
                    );

                }
            );

        }

    } catch (error) {

        console.warn(
            "Minecraft options:",
            error
        );

    }

    await loadMinecraftVersions();

}

async function checkDiscount() {

    hideError();

    const input =
        document.getElementById(
            "discountCode"
        );

    const code =
        String(
            input.value || ""
        ).trim();

    if (!code) {

        discountPercent =
            0;

        appliedDiscountCode =
            null;

        document.getElementById(
            "discountInfo"
        ).textContent =
            "";

        updateSummary();

        return;

    }

    try {

        const response =
            await fetch(
                `${API}/codes/check`,
                {
                    method: "POST",
                    credentials:
                        "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            code
                        })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Nieprawidłowy kod rabatowy."
            );

        }

        const percent =
            Number(
                data.percent ??
                data.discountPercent ??
                data.discount ??
                data.code?.percent ??
                0
            );

        if (
            !Number.isFinite(percent) ||
            percent <= 0
        ) {

            throw new Error(
                "Kod nie zawiera prawidłowego rabatu."
            );

        }

        discountPercent =
            percent;

        appliedDiscountCode =
            code;

        document.getElementById(
            "discountInfo"
        ).textContent =
            `Kod aktywny: -${percent}%`;

        updateSummary();

    } catch (error) {

        discountPercent =
            0;

        appliedDiscountCode =
            null;

        document.getElementById(
            "discountInfo"
        ).textContent =
            "";

        showError(
            error.message
        );

        updateSummary();

    }

}

async function purchaseService() {

    hideError();

    if (
        ![
            "minecraft",
            "discord",
            "web"
        ].includes(type)
    ) {

        showError(
            "Nieprawidłowy typ usługi."
        );

        return;

    }

    if (!selectedPackage) {

        showError(
            "Wybierz pakiet."
        );

        return;

    }

    const price =
        getFinalPrice();

    if (
        !Number.isFinite(price) ||
        price <= 0
    ) {

        showError(
            "Nieprawidłowa cena usługi."
        );

        return;

    }

    if (
        walletBalance <
        price
    ) {

        showError(
            `Niewystarczające środki. Masz ${money(walletBalance)}, a potrzebujesz ${money(price)}.`
        );

        return;

    }

    purchaseButton.disabled =
        true;

    purchaseButton.textContent =
        "Kupowanie...";

    try {

        /*
         * WAŻNE:
         * Backend dostaje trzy pola z tym samym
         * technicznym typem usługi.
         *
         * Nigdy nie wysyłamy tutaj:
         * "Serwery Minecraft"
         * "Boty Discord"
         * "Strony WWW"
         *
         * Wysyłamy wyłącznie:
         * minecraft / discord / web
         */

        const body = {

            service:
                type,

            type:
                type,

            serviceType:
                type,

            package:
                selectedPackage,

            packageName:
                selectedPackage,

            days:
                Number(
                    selectedDays
                ),

            config:
                getConfig()

        };

        if (
            appliedDiscountCode
        ) {

            body.code =
                appliedDiscountCode;

            body.discountCode =
                appliedDiscountCode;

        }

        console.log(
            "ZenityHost purchase:",
            body
        );

        const response =
            await fetch(
                `${API}/purchase`,
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                `HTTP ${response.status}`
            );

        }

        const service =
            data.service ||
            data.data ||
            data;

        const serviceId =
            service.id ||
            service.serviceId;

        if (!serviceId) {

            throw new Error(
                "Zakup został wykonany, ale serwer nie zwrócił ID usługi."
            );

        }

        const paths = {

            minecraft:
                "/hosting/services/minecraft/",

            discord:
                "/hosting/services/discord/",

            web:
                "/hosting/services/web/"

        };

        window.location.href =
            `${paths[type]}?id=${encodeURIComponent(serviceId)}&type=${encodeURIComponent(type)}`;

    } catch (error) {

        console.error(
            "Purchase:",
            error
        );

        showError(
            error.message
        );

        purchaseButton.disabled =
            false;

        purchaseButton.textContent =
            "Kup usługę";

    }

}

function setupDays() {

    document
        .querySelectorAll(
            ".day"
        )
        .forEach(
            day => {

                day.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".day"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );

                        day.classList.add(
                            "active"
                        );

                        selectedDays =
                            Number(
                                day.dataset.days
                            );

                        selectedPackage =
                            null;

                        discountPercent =
                            0;

                        appliedDiscountCode =
                            null;

                        renderPackages();

                    }
                );

            }
        );

}

function setupType() {

    const validTypes = [
        "minecraft",
        "discord",
        "web"
    ];

    if (
        !validTypes.includes(type)
    ) {

        document.getElementById(
            "title"
        ).textContent =
            "Nieprawidłowy typ usługi";

        document.getElementById(
            "subtitle"
        ).textContent =
            "Wróć do ZenityHost i wybierz usługę.";

        packagesElement.innerHTML =
            "";

        purchaseButton.disabled =
            true;

        showError(
            "Nieprawidłowy typ usługi."
        );

        return false;

    }

    document.getElementById(
        "title"
    ).textContent =
        typeNames[type];

    document.getElementById(
        "subtitle"
    ).textContent =
        type === "minecraft"
            ? "Skonfiguruj i zamów swój hosting Minecraft."
            : type === "discord"
                ? "Skonfiguruj i zamów hosting bota Discord."
                : "Skonfiguruj i zamów hosting WWW.";

    document.getElementById(
        "minecraftConfig"
    ).style.display =
        type === "minecraft"
            ? "block"
            : "none";

    document.getElementById(
        "discordConfig"
    ).style.display =
        type === "discord"
            ? "block"
            : "none";

    document.getElementById(
        "webConfig"
    ).style.display =
        type === "web"
            ? "block"
            : "none";

    return true;

}

document
    .getElementById(
        "checkCode"
    )
    .addEventListener(
        "click",
        checkDiscount
    );

purchaseButton.addEventListener(
    "click",
    purchaseService
);

document
    .getElementById(
        "minecraftSoftware"
    )
    ?.addEventListener(
        "change",
        loadMinecraftVersions
    );

(async function init() {

    if (!setupType()) {
        return;
    }

    setupDays();

    renderPackages();

    await Promise.all([
        loadWallet(),
        loadPrices()
    ]);

    await loadMinecraftOptions();

    updateSummary();

})();

</script>
