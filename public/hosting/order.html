<!DOCTYPE html>
<html lang="pl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZenityHost | Zamówienie</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #102b4f,
                    #050b14 70%
                );

            color: white;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .top {
            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(4,9,19,.88);

            border-bottom:
                1px solid rgba(255,255,255,.08);
        }

        .brand {
            font-size: 21px;
            font-weight: 800;
        }

        .brand span {
            color: #4da3ff;
        }

        .wallet {
            padding: 10px 15px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #d4a72c,
                    #f4d05c
                );

            color: #111827;
            font-weight: 800;
        }

        .container {
            width: min(900px, 92%);
            margin: auto;
            padding: 45px 0 70px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;

            color: #70b5ff;
            font-size: 14px;
        }

        .box {
            padding: 30px;

            border-radius: 18px;

            background: #0b1728;

            border:
                1px solid rgba(255,255,255,.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 25px;

            color: #91a1b4;
            line-height: 1.6;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .plan {
            padding: 22px;

            border-radius: 14px;

            background: #10243c;

            border:
                1px solid rgba(255,255,255,.07);
        }

        .plan h2 {
            margin-bottom: 10px;
            font-size: 19px;
        }

        .plan p {
            margin-bottom: 18px;

            color: #91a1b4;
            font-size: 13px;
            line-height: 1.5;
        }

        .periods {
            display: grid;
            gap: 8px;
        }

        .period {
            padding: 11px;

            border-radius: 9px;

            background: #071525;

            text-align: center;

            font-weight: 800;
            font-size: 13px;
        }

        .period:hover {
            background: #1764a8;
        }

        .selected {
            margin-bottom: 25px;
            padding: 18px;

            border-radius: 12px;

            background:
                rgba(77,163,255,.08);

            border:
                1px solid rgba(77,163,255,.2);

            color: #a9cfff;

            line-height: 1.7;
        }

        .order-button {
            width: 100%;

            margin-top: 25px;
            padding: 14px;

            border: 0;
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #1665ad,
                    #3289df
                );

            color: white;

            font-weight: 800;
            cursor: pointer;
        }

        @media(max-width:700px) {

            .plans {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header class="top">

    <a href="/hosting" class="brand">
        Zenity<span>Host</span>
    </a>

    <a href="/wallet" class="wallet">
        💰 Portfel:
        <span id="walletBalance">...</span>
    </a>

</header>

<main class="container">

    <a
        href="/hosting"
        class="back"
    >
        ← Wróć do ZenityHost
    </a>

    <div class="box">

        <h1 id="title">
            Wybierz usługę
        </h1>

        <p
            id="description"
            class="description"
        >
            Wybierz odpowiedni pakiet i okres.
        </p>

        <div
            id="selected"
            class="selected"
            style="display:none;"
        ></div>

        <div
            id="plans"
            class="plans"
        ></div>

    </div>

</main>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const service =
    params.get("service");

const plan =
    params.get("plan");

const days =
    params.get("days");

const title =
    document.getElementById("title");

const description =
    document.getElementById("description");

const plans =
    document.getElementById("plans");

const selected =
    document.getElementById("selected");


/*
    PORTFEL
*/

fetch("/api/wallet")
    .then(response => response.json())
    .then(data => {

        document.getElementById(
            "walletBalance"
        ).textContent =
            Number(
                data.balance || 0
            ).toFixed(2) + " zł";

    })
    .catch(() => {

        document.getElementById(
            "walletBalance"
        ).textContent = "—";

    });


/*
    CENY BOTÓW
*/

const discordPlans = [

    {
        name: "Bot Start",
        description: "Podstawowy hosting dla małego bota.",
        prices: {
            7: 1,
            30: 3,
            90: 8
        }
    },

    {
        name: "Bot Plus",
        description: "Więcej zasobów dla większych botów.",
        prices: {
            7: 2,
            30: 6,
            90: 15
        }
    },

    {
        name: "Bot PRO",
        description: "Pakiet dla wymagających projektów.",
        prices: {
            7: 4,
            30: 10,
            90: 25
        }
    }

];


/*
    CENY WWW
*/

const webPlans = [

    {
        name: "WWW Start",
        description: "Podstawowy hosting małej strony.",
        prices: {
            7: 2,
            30: 5,
            90: 12
        }
    },

    {
        name: "WWW Plus",
        description: "Więcej miejsca dla większej strony.",
        prices: {
            7: 4,
            30: 10,
            90: 25
        }
    },

    {
        name: "WWW PRO",
        description: "Pakiet dla większych projektów.",
        prices: {
            7: 7,
            30: 18,
            90: 45
        }
    }

];


function createPlans(
    list,
    serviceName
) {

    plans.innerHTML = "";

    list.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "plan";

        card.innerHTML = `

            <h2>
                ${item.name}
            </h2>

            <p>
                ${item.description}
            </p>

            <div class="periods">

                <a
                    class="period"
                    href="/hosting/order.html?service=${serviceName}&plan=${encodeURIComponent(item.name)}&days=7"
                >
                    7 dni<br>
                    ${item.prices[7]} zł
                </a>

                <a
                    class="period"
                    href="/hosting/order.html?service=${serviceName}&plan=${encodeURIComponent(item.name)}&days=30"
                >
                    30 dni<br>
                    ${item.prices[30]} zł
                </a>

                <a
                    class="period"
                    href="/hosting/order.html?service=${serviceName}&plan=${encodeURIComponent(item.name)}&days=90"
                >
                    90 dni<br>
                    ${item.prices[90]} zł
                </a>

            </div>

        `;

        plans.appendChild(card);

    });

}


/*
    WYBRANO PAKIET
*/

if (
    service &&
    plan &&
    days
) {

    title.textContent =
        "Podsumowanie zamówienia";

    description.textContent =
        "Sprawdź wybrany pakiet przed przejściem dalej.";

    plans.innerHTML = "";

    let price = 0;

    if (service === "discord") {

        const item =
            discordPlans.find(
                x => x.name === plan
            );

        if (item) {
            price =
                item.prices[days];
        }

    }

    if (service === "web") {

        const item =
            webPlans.find(
                x => x.name === plan
            );

        if (item) {
            price =
                item.prices[days];
        }

    }

    selected.style.display =
        "block";

    selected.innerHTML = `
        <strong>Wybrana usługa:</strong>
        ${service === "discord"
            ? "Bot Discord"
            : service === "web"
                ? "Strona WWW"
                : "Minecraft"
        }<br>

        <strong>Pakiet:</strong>
        ${plan}<br>

        <strong>Okres:</strong>
        ${days} dni<br>

        <strong>Cena:</strong>
        ${price} zł
    `;

    const button =
        document.createElement("button");

    button.className =
        "order-button";

    button.textContent =
        "Przejdź do zamówienia";

    button.onclick = () => {

        alert(
            "System zamówień zostanie podłączony do portfela."
        );

    };

    plans.appendChild(button);

}


/*
    WYBRANO DISCORD
*/

else if (
    service === "discord"
) {

    title.textContent =
        "Hosting Botów Discord";

    description.textContent =
        "Wybierz pakiet, a następnie okres 7, 30 lub 90 dni.";

    createPlans(
        discordPlans,
        "discord"
    );

}


/*
    WYBRANO WWW
*/

else if (
    service === "web"
) {

    title.textContent =
        "Hosting Stron WWW";

    description.textContent =
        "Wybierz pakiet, a następnie okres 7, 30 lub 90 dni.";

    createPlans(
        webPlans,
        "web"
    );

}


/*
    BRAK USŁUGI
*/

else {

    title.textContent =
        "Nie wybrano usługi";

    description.textContent =
        "Wróć do ZenityHost i wybierz usługę.";

}

</script>

</body>
</html>
