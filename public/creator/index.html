<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafika Creator - ZenityCode</title>
<link rel="stylesheet" href="/style.css">
<style>

.container{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.panel{
    background:#0f172a;
    border-radius:20px;
    padding:25px;
    border:1px solid rgba(59,130,246,.2);
    margin-bottom:25px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

input[type=text]{
    width:100%;
    background:#030712;
    color:white;
    border:1px solid #1e293b;
    border-radius:12px;
    padding:14px;
    margin-top:8px;
}

input[type=color]{
    width:100%;
    height:55px;
    border:none;
    background:none;
    margin-top:8px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

canvas{
    width:100%;
    background:#08142b;
    border-radius:20px;
    margin-top:25px;
}

#download{
    display:none;
    margin-top:20px;
    text-decoration:none;
    background:#22c55e;
    color:white;
    padding:12px 18px;
    border-radius:12px;
}

@media(max-width:900px){

    .row{
        grid-template-columns:1fr;
    }

}
</style>
</head>
<body>

<div class="container">

<h1 style="margin-bottom:25px;">
🎨 Grafika Creator
</h1>

<div class="panel">

<div class="row">

<div>
<label>Górny napis</label>
<input id="topText" type="text" value="ZET">
</div>

<div>
<label>Dolny napis</label>
<input id="bottomText" type="text" value="SIGMA">
</div>

</div>

<div class="row" style="margin-top:20px;">

<div>
<label>Kolor górnego napisu</label>
<input id="topColor" type="color" value="#2196ff">
</div>

<div>
<label>Kolor dolnego napisu</label>
<input id="bottomColor" type="color" value="#ffb300">
</div>

</div>

<button onclick="generate()">
🚀 Generuj Grafikę
</button>

</div>

<canvas
id="canvas"
width="1200"
height="600">
</canvas>

<br>

<a
id="download"
download="zenitycode-grafika.png">
📥 Pobierz PNG
</a>

</div>

<script src="script.js"></script>

</body>
</html>
