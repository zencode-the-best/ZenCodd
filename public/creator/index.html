<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafika Creator - ZenCode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎨 Grafika Creator</h1>

    <input id="topText" placeholder="Górny napis (np. ZET)">

    <input id="bottomText" placeholder="Dolny napis (np. SIGMA)">

    <h3>🎨 Kolor tekstu</h3>

    <input
        type="color"
        id="colorPicker"
        value="#2196ff"
        oninput="updateColor()"
    >

    <p id="colorPreview">
        #2196ff
    </p>

    <button onclick="generate()">
        🚀 Generuj Grafikę
    </button>

    <canvas id="canvas" width="1000" height="500"></canvas>

    <a id="download" download="zencode-grafika.png">
        📥 Pobierz PNG
    </a>

</div>

<script src="script.js"></script>

</body>
</html>
