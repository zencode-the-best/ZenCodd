<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portfel | ZenityCode</title>

    <link
        rel="stylesheet"
        href="/wallet/style.css"
    >

</head>

<body>

    <main class="wallet-page">

        <a
            href="/dashboard"
            class="back"
        >
            ← Wróć do dashboardu
        </a>


        <section class="wallet-card">

            <div class="wallet-top">

                <div>

                    <span class="label">
                        TWÓJ PORTFEL
                    </span>

                    <h1>
                        💳 Portfel
                    </h1>

                </div>

                <div class="balance">

                    <span>
                        Saldo
                    </span>

                    <strong id="balance">
                        0,00 zł
                    </strong>

                </div>

            </div>


            <div class="topup">

                <h2>
                    Doładuj portfel
                </h2>

                <p>
                    Wybierz kwotę, a następnie metodę płatności.
                </p>


                <div class="amounts">

                    <button
                        data-amount="10"
                    >
                        10 zł
                    </button>

                    <button
                        data-amount="20"
                    >
                        20 zł
                    </button>

                    <button
                        data-amount="50"
                    >
                        50 zł
                    </button>

                    <button
                        data-amount="100"
                    >
                        100 zł
                    </button>

                </div>


                <label>
                    Własna kwota
                </label>

                <input
                    id="customAmount"
                    type="number"
                    min="1"
                    max="1000"
                    step="0.01"
                    placeholder="np. 25"
                >


                <h3>
                    Metoda płatności
                </h3>


                <div class="methods">

                    <button
                        class="method"
                        data-method="blik"
                    >
                        <strong>
                            🟢 BLIK
                        </strong>

                        <span>
                            Płatność BLIK
                        </span>
                    </button>


                    <button
                        class="method"
                        data-method="przelew"
                    >
                        <strong>
                            🏦 Przelew
                        </strong>

                        <span>
                            Przelew online
                        </span>
                    </button>


                    <button
                        class="method"
                        data-method="paypal"
                    >
                        <strong>
                            🅿️ PayPal
                        </strong>

                        <span>
                            Płatność PayPal
                        </span>
                    </button>

                </div>


                <button
                    id="topupButton"
                    class="topup-button"
                >
                    Doładuj portfel
                </button>


                <p
                    id="message"
                    class="message"
                ></p>

            </div>

        </section>


        <section class="history">

            <h2>
                🧾 Historia transakcji
            </h2>

            <div id="transactions">

                <p class="loading">
                    Ładowanie...
                </p>

            </div>

        </section>

    </main>


    <script src="/wallet/script.js"></script>

</body>

</html>
